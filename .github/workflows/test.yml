name: dev 테스트 및 빌드

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: dev-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 검증 및 디버그 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v7

      - name: JDK 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle Wrapper 실행 권한 설정
        run: chmod +x gradlew

      - name: 테스트 및 정적 분석
        run: ./gradlew verify --no-daemon

      - name: 자동 포맷 미반영 확인
        run: git diff --exit-code

      - name: 디버그 앱 빌드
        run: ./gradlew assembleDebug --no-daemon

      - name: 디버그 APK를 워크플로 아티팩트로 업로드
        uses: actions/upload-artifact@v7
        with:
          name: smartbudget-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
