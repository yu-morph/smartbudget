name: 릴리즈 앱 빌드 및 첨부

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: APK 및 AAB 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 릴리즈 태그 소스 코드 체크아웃
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: JDK 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle Wrapper 실행 권한 설정
        run: chmod +x gradlew

      - name: 릴리즈 태그 검증 및 앱 버전 계산
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "릴리즈 태그는 v1.0.0 형식이어야 합니다." >&2
            exit 1
          fi

          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))

          if (( major > 2099 || minor > 999 || patch > 999 )); then
            echo "버전 숫자가 Android versionCode 변환 범위를 벗어났습니다." >&2
            exit 1
          fi

          version_name="${major}.${minor}.${patch}"
          version_code=$((major * 1000000 + minor * 1000 + patch))

          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "계산된 Android versionCode가 허용 범위를 벗어났습니다." >&2
            exit 1
          fi

          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: 릴리즈 서명 키 준비
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Android 릴리즈 서명용 GitHub Actions secret이 모두 필요합니다." >&2
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/smartbudget-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/smartbudget-release.jks" >> "$GITHUB_ENV"

      - name: 테스트 및 릴리즈 앱 빌드
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew verify assembleRelease bundleRelease --no-daemon
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: 릴리즈 파일 준비
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/smartbudget-${RELEASE_TAG}-arm.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-assets/smartbudget-${RELEASE_TAG}-arm.aab"

      - name: GitHub 릴리즈에 앱 파일 첨부
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.apk release-assets/*.aab --clobber
